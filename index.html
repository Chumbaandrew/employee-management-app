<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Landing Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

</head>
<body>

<div class="container--carousel">
    <div class="header--nav--carousel">
    <header>Employee Management system</header>
    <button class="launchbtn--carousel" onclick="window.location.href='getstarted.html'">Launch <i class="fa-solid fa-square-up-right" style="color: rgb(51, 51, 51);"></i></button>
    </div>

    <div class="carousel">
        
        <div class="card--carousel dark--1">
          <div class="details--card--carousel">
                    <span class="title--carousel">Easy Management</span>
              <i class="fa-solid fa-list-check icon light--1" style="color: rgb(51, 51, 51);"></i>
          </div>
        </div>
        
        <div class="card--carousel dark--2">
          <div class="details--card--carousel ">
                <span class="title--carousel">fast identification</span>
              <i class="fa-solid fa-bolt icon light--2" style="color: rgb(51, 51, 51);"></i>
          </div>
        </div>

        <div class="card--carousel dark--3">
            <div class="details--card--carousel ">
                    <span class="title--carousel">Reliable</span>
                <i class="fa-solid fa-signal icon light--3" style="color: rgb(51, 51, 51);"></i>
            </div>
        </div>

        <div class="card--carousel dark--4">
            <div class="details--card--carousel ">
                    <span class="title--carousel">Simple UI</span>
                <i class="fa-solid fa-face-grin icon light--4" style="color: rgb(51, 51, 51);"></i>
            </div>
        </div>

        <div class="card--carousel dark--5">
            <div class="details--card--carousel ">
                    <span class="title--carousel">Secure</span>
                <i class="fa-solid fa-fingerprint icon light--5" style="color: rgb(51, 51, 51);"></i>
            </div>
        </div>

        <div class="card--carousel dark--6">
            <div class="details--card--carousel ">
                    <span class="title--carousel">Customer Support</span>
                <i class="fa-solid fa-headset icon light--6" style="color: rgb(51, 51, 51);"></i>
            </div>
        </div>

        <div class="card--carousel dark--7">
            <div class="details--card--carousel ">
                <span class="title--carousel">International</span>
                <i class="fa-solid fa-globe icon light--7" style="color: rgb(51, 51, 51);"></i>
            </div>
        </div>
    </div>
</div>
<style>
    .container--carousel{
        position: relative;
        max-width: 1000px;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.49);
        border-radius:8px;
        padding: 30px;
        margin: 0 15px;
        box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }
    .header--nav--carousel{
        display:flex;
        align-items: center;
        justify-content: space-between;
    }
    .launchbtn--carousel{
        height: 45px;
        max-width: 150px;
        width: 100%;
        border: none;
        outline: none;
        border-radius: 5px;
        margin: 25px 0;
        background-color: #fbd958;
        transition: 0.1s;
        box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        cursor: pointer;
        font-size: 16px;
        font-weight: 500;
    }
    .launchbtn--carousel:hover{
        transform:scale(1.14);
        background-color: #ff914d;
    }
    .container--carousel header{
        position: relative;
        font-size: 35px;
        font-weight: 600;
        color: #333;
    }
    .container--carousel header::before{
        content:"";
        position: absolute;
        left: 0;
        bottom: -2px;
        height: 3px;
        width: 27px;
        background-color: #FFDE59FF;
        border-radius: 8px;
    }
    .carousel{
        padding: 8px;
        width: 100%;
        margin: 3em auto;
        overflow-x: auto;
        display: flex;
        gap: 1em;
        scroll-behavior: smooth;
        anchor-name: --carousel;
        scroll-snap-type: x mandatory;
        scroll-marker-group: after;
    }
    .carousel::scroll-marker-group{
        display:flex;
        justify-content: center;
        gap: .5em;
    }
    .card--carousel::scroll-marker {
        content: '';
        height: 1em;
        width: 1em;
        background-color: #3333;
        border-radius: 50%;
    }
    .card--carousel::scroll-marker:target-current{
        background-color: #FFDE59FF;
    }
    .carousel::-webkit-scrollbar{
        display: none;
    }
    .carousel::scroll-button(right),.carousel::scroll-button(left) {
        content: '>';
        border: none;
        background-color: #FFDE59FF;
        font-family: "Courier New", Courier, monospace;
        font-size: 2rem;
        color: #000000;
        height: 50px;
        width: 50px;
        border-radius: 50%;
        padding-bottom: 0.1em;
        cursor: pointer;
        position: fixed;
        position-anchor: --carousel;
        position-area: right center;
        translate: -50%
    }
    .carousel::scroll-button(left){
        content: '<';
        position-area:left center;
        translate: 50%;
    }
    .carousel::scroll-button(right):disabled,.carousel::scroll-button(left):disabled{
        opacity: 0.5;
        cursor: auto;
    }

    .card--carousel{
        scroll-snap-align: start;
        flex: 0 0 20em;
        height: 14em;
        padding: 1em;
        border-radius: .5em;
        text-align: center;
        align-content: center;
    }
    .details--card--carousel{
        display: flex;
        align-items: center;
        flex-direction: column;

    }

    .card--carousel:hover{
        transform: translateY(-4px);
        transition: 0.1s;
    }
    .title--carousel{
        font-size: 20px;
        font-weight: 600;
    }
    .icon {

        display: inline flex;
        justify-content:center;
        align-items: center;
        margin-top: 10px;
        padding: 0;
        height: 60px;
        width: 60px;
        text-align: center;
        border-radius: 50%;
        font-size: 1.6rem;
        line-height: 1;
    }
</style>
</body>
</html>
