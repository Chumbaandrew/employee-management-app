<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Landing Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

</head>
<body>

<div class="container">
    <div class="header--nav">
    <header>Employee Management system</header>
    <button class="launchbtn" onclick="window.location.href='getstarted.html'">Launch <i class="fa-solid fa-square-up-right" style="color: rgb(51, 51, 51);"></i></button>
    </div>

    <div class="carousel">
        
        <div class="card dark--1">
          <div class="details--card">
                    <span class="title">Easy Management</span>
              <i class="fa-solid fa-list-check icon light--1" style="color: rgb(51, 51, 51);"></i>
          </div>
        </div>
        
        <div class="card dark--2">
          <div class="details--card ">
                <span class="title">fast identification</span>
              <i class="fa-solid fa-bolt icon light--2" style="color: rgb(51, 51, 51);"></i>
          </div>
        </div>

        <div class="card dark--3">
            <div class="details--card ">
                    <span class="title">Reliable</span>
                <i class="fa-solid fa-signal icon light--3" style="color: rgb(51, 51, 51);"></i>
            </div>
        </div>

        <div class="card dark--4">
            <div class="details--card ">
                    <span class="title">Simple UI</span>
                <i class="fa-solid fa-face-grin icon light--4" style="color: rgb(51, 51, 51);"></i>
            </div>
        </div>

        <div class="card dark--5">
            <div class="details--card ">
                    <span class="title">Secure</span>
                <i class="fa-solid fa-fingerprint icon light--5" style="color: rgb(51, 51, 51);"></i>
            </div>
        </div>

        <div class="card dark--6">
            <div class="details--card ">
                    <span class="title">Customer Support</span>
                <i class="fa-solid fa-headset icon light--6" style="color: rgb(51, 51, 51);"></i>
            </div>
        </div>

        <div class="card dark--7">
            <div class="details--card ">
                <span class="title">International</span>
                <i class="fa-solid fa-globe icon light--7" style="color: rgb(51, 51, 51);"></i>
            </div>
        </div>
    </div>
</div>







<style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jost:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }
    body{
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(90deg, #ffde59, #ff914d);
    }
    .container{
        position: relative;
        max-width: 1000px;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.49);
        border-radius:8px;
        padding: 30px;
        margin: 0 15px;
        box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }
    .header--nav{
        display:flex;
        align-items: center;
        justify-content: space-between;
    }
    .launchbtn{
        height: 45px;
        max-width: 150px;
        width: 100%;
        border: none;
        outline: none;
        border-radius: 5px;
        margin: 25px 0;
        background-color: #fbd958;
        transition: 0.1s;
        box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        cursor: pointer;
        font-size: 16px;
        font-weight: 500;
    }
    .launchbtn:hover{
        transform:scale(1.14);
        background-color: #ff914d;
    }
    .container header{
        position: relative;
        font-size: 35px;
        font-weight: 600;
        color: #333;
    }
    .container header::before{
        content:"";
        position: absolute;
        left: 0;
        bottom: -2px;
        height: 3px;
        width: 27px;
        background-color: #FFDE59FF;
        border-radius: 8px;
    }
    .carousel{
        padding: 8px;
        width: 100%;
        margin: 3em auto;
        overflow-x: auto;
        display: flex;
        gap: 1em;
        scroll-behavior: smooth;
        anchor-name: --carousel;
        scroll-snap-type: x mandatory;
        scroll-marker-group: after;
    }
    .carousel::scroll-marker-group{
        display:flex;
        justify-content: center;
        gap: .5em;
    }
    .card::scroll-marker {
        content: '';
        height: 1em;
        width: 1em;
        background-color: #3333;
        border-radius: 50%;
    }
    .card::scroll-marker:target-current{
        background-color: #FFDE59FF;
    }
    .carousel::-webkit-scrollbar{
        display: none;
    }
    .carousel::scroll-button(right),.carousel::scroll-button(left) {
        content: '>';
        border: none;
        background-color: #FFDE59FF;
        font-family: "Courier New", Courier, monospace;
        font-size: 2rem;
        color: #000000;
        height: 50px;
        width: 50px;
        border-radius: 50%;
        padding-bottom: 0.1em;
        cursor: pointer;
        position: fixed;
        position-anchor: --carousel;
        position-area: right center;
        translate: -50%
    }
    .carousel::scroll-button(left){
        content: '<';
        position-area:left center;
        translate: 50%;
    }
    .carousel::scroll-button(right):disabled,.carousel::scroll-button(left):disabled{
        opacity: 0.5;
        cursor: auto;
    }
    
    .card{
        scroll-snap-align: start;
        flex: 0 0 20em;
        height: 14em;
        background-color: #3333;
        padding: 1em;
        border-radius: .5em;
        text-align: center;
        align-content: center;
    }
    .details--card{
       display: flex;
        align-items: center;
       flex-direction: column;}
    
    .card:hover{
        transform: translateY(-4px);
        transition: 0.1s;
    }
    .title{
        font-size: 20px;
        font-weight: 600;
    }
    .icon {
        padding: 1rem;
        height: 60px;
        width:60px;
        text-align: center;
        border-radius: 50%;
        font-size: 1.5rem;
        background: rgba(51, 51, 51, 0.65);

    }
    .light--1{
        background-color: rgba(94, 186, 248, 0.75);
    }
    .light--2{
        background-color: rgba(104, 251, 185, 0.75);
    }
    .light--3{
        background-color: rgba(250, 145, 80, 0.75);
    }
    .light--4{
        background-color: rgba(225, 193, 110, 0.75);
    }
    .light--5{
        background-color: rgba(81, 65, 79, 0.75);
    }
    .light--6{
        background-color: rgba(114, 47, 55, 0.75);
    }
    .light--7{
        background-color: rgba(0, 255, 127, 0.75);
    }
    .dark--1{
        background-color:rgba(94, 186, 248, 0.30);
        
    }.dark--2{
         background-color:rgba(104, 251, 185, 0.30);

    }
    .dark--3{
          background-color: rgba(250, 145, 80, 0.30);
      }
    .dark--4{
        background-color:rgba(225, 193, 110, 0.30);
    }
    .dark--5{
         background-color:rgba(81, 65, 79, 0.30);

    }.dark--6{
          background-color:rgba(114, 47, 55, 0.30);
        
    }
    .dark--7{
        background-color: rgba(0, 255, 127, 0.30);
    }
      
    
    


</style>
</body>
</html>
