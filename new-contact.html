<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="newcontact">
<div class="heronew"><h3><b> Add New Contact</b></h3></div>
<div class="formdiv">
<form class="form">

    <div class="formrow">
    <label for="ID" id="ID">ID Number:</label>
    <input type="number" placeholder="Identification number" required>
    </div>


    <div class="formrow">
    <label for="fname" id="fname">First Name:</label>
    <input type="text" placeholder=" Enter First Name" required>
    </div>

    <div class="formrow">
    <label for="lname" id="lname">Last Name:</label>
    <input type="text" placeholder="Enter Last Name" required>
    </div>

    <div class="formrow">
    <label for="phone" id="phone">Phone:</label>
    <input type="number" placeholder="Enter Phone number" required>
    </div>

    <div class="formrow">
    <label for="email" id="email">Email:</label>
    <input type="email"  placeholder="@gmail.com">
    </div>

    <div class="formrow">
    <label for="address" id="address"> Address:</label>
    <input type="number" placeholder="Enter Home Address" required>
    </div>

    <div class="formrow">
    <label for="DOB" id="DOB">Date OF Birth:</label>
    <input type="date" placeholder="" required>
    </div>

    <div class="formrow">
    <label for="position" id="position">ID Number:</label>
    <input type="text" placeholder="select position" required>
    </div>


    <div class="formrow">
    <label for="gender" id="gender">Male:</label>
    <input type="radio"  name="opt1"  required>
    <label for="gender" id="female">Female:</label>
    <input type="radio"  name="opt1"  required>
    </div>




</form>
</div>
<div class="submitbutton"><input type="submit" name="" id=""></div>
</body>
</html>
