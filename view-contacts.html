<style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jost:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
*{
    margin:0;
    padding:0;
    box-sizing: border-box;
    font-family: 'Poppins', Jost, sans-serif;
}
    body{
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(90deg, #ffde59, #ff914d);
    }
    .container{
        position: relative;
        max-width: 1200px;
        width: 100%;
        background-color: #fff;
        border-radius: 6px;
        padding: 30px;
        margin: 0 15px;
        box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }
    .container header{
        position: relative;
        font-size: 30px;
        font-weight: 600;
        color: #333;
    }
    .container header::before{
        content:"";
        position: absolute;
        left: 0;
        bottom: -2px;
        height: 3px;
        width: 27px;
        background-color: #FFDE59FF;
        border-radius: 8px;
    }
    .container .topnav{
        display: flex;
        justify-content: space-between;
    }
    .container .topnav button , .back{
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 40px;
        max-width: 150px;
        width: 100%;
        border: none;
        outline: none;
        border-radius: 6px;
        background-color: #fd914d;
        transition: 0.1s;
        box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        cursor: pointer;
    }
    .topnav button:hover{
        transform:translateX(0.5px) translateY(2px);
    }
    .back:hover{
        transform:translateX(0.5px) translateY(2px);
        background-color: #FFDE59FF;
    }
    .container .table{
        position: relative;
        min-height: 402px;
        margin-top: 30px;
        overflow: auto;
       
    }
    table{
        width: 100%;
        table-layout: fixed;
        min-width: 1000px;
      
    }
    thead th{
        position: sticky;
        top:0;
        background-color: #FFDE59FF;
        color: #333;
        font-size: 15px;
    }
    th,td{
        border: 1px solid #dddddd;
        padding: 8px 8px;
        word-break: break-all;
        text-align: center;
        border-collapse: collapse;
    }
    tr:hover td{
        
        cursor: pointer;
        background-color: rgba(255, 222, 89, 0.22)
    }
    .container .table button{
        border: none;
        outline: none;
        border-radius: 6px;
        padding: 5px;
    }
    .container .table button:hover{
        transform:translateX(0.5px) translateY(1px);
    }
    td button:nth-child(1){
    background-color: #3488f2;
    
    }

    }
